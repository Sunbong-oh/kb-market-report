name: probe
on: { push: { branches: ["probe/**"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 earnings_watch.py --dry $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M) | grep -v '^   \|^  {\|^  }\|^ \]'
          python3 earnings_watch.py --dry 2026-10-09T16:00 | grep '감지\|📈\|"px"' 
          python3 - <<'PY'
          import earnings_watch as e
          from datetime import datetime
          e.NOW = datetime(2026,10,10,6,0,tzinfo=e.KST)
          print(e.yahoo_reaction("MU", "마이크론(미국 MU)", datetime(2026,10,1,5,10,tzinfo=e.KST)))
          e.NOW = datetime.now(e.KST)
          print(e.yahoo_reaction("MU", "마이크론(미국 MU)", datetime(2026,10,13,5,10,tzinfo=e.KST)))
          print(e.yahoo_reaction("ASML", "ASML(미국)", datetime(2026,10,14,14,0,tzinfo=e.KST)))
          print(e.naver_reaction("005930", "삼성전자", datetime(2026,10,14,7,44,tzinfo=e.KST)))
          PY
