name: 실시간 수급 (장중)

# 평일 08:00~16:05 KST, 1분마다 리포트 화면 데이터를 flow-live/snapshot.json 에 올린다 (live_snapshot.py).
# 회사 PC 서버가 켜져 있으면 PC가 올리고(선물 분 단위 기록 포함), 이 작업은 그동안 건너뛴다.
# 이어달리기: 한 작업은 최대 5시간 40분 돌고(장 시간이 아니면 기다리기만), 끝나면 마지막 단계가 다음 작업을 바로 띄운다.
# 그래서 GitHub 예약 지연(몇 시간씩)이나 07:50 시작 루틴 실패와 상관없이 매일 08:00부터 돈다.
# 아래 예약은 이어달리기가 끊겼을 때를 위한 예비. 한 번에 한 작업만 돈다(concurrency). 수동으로 끊으려면 실행 중인 작업을 취소.
on:
  schedule:
    - cron: "50 22 * * 0-4"   # 07:50 KST (월~금)
    - cron: "30 0 * * 1-5"    # 09:30
    - cron: "0 2 * * 1-5"     # 11:00
    - cron: "0 4 * * 1-5"     # 13:00
    - cron: "30 5 * * 1-5"    # 14:30
  # Claude 루틴이 평일 07:50(KST)에 trigger-live/request.txt 를 main에 push → 예약 지연 없이 바로 시작
  push:
    branches: [main]
    paths: ["trigger-live/**"]
  workflow_dispatch:

permissions:
  contents: write   # flow-live 브랜치 갱신
  actions: write    # 다음 작업 이어 띄우기

concurrency:
  group: live-snapshot
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KB_OPENAPI_APP_KEY: ${{ secrets.KB_OPENAPI_APP_KEY }}
      KB_OPENAPI_APP_SECRET: ${{ secrets.KB_OPENAPI_APP_SECRET }}
      REPORT_ONLY: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python live_snapshot.py
        env:
          GH_TOKEN: ${{ github.token }}   # 목표주가 리포트 실행 요청(gh workflow run)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 실적 속보 알림 (earnings_watch.py, 10분마다)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 다음 작업 이어 띄우기 (취소된 경우 제외)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-snapshot.yml --repo "${{ github.repository }}" --ref main
