name: 제주 아이 행사 알리미

# 15분마다 실행:
#   1) 텔레그램 받은편지함 (inbox.py) - 인스타 링크·포스터 캡처·모집 글을 읽어 일정에 추가하고 답장
#   2) 알림 (kids.py --auto) - 신청 3일 전·전날 저녁·당일 아침·시작 1시간 전, 마감 전날
#      기관 누리집·뉴스 수집은 아침 6시·저녁 8시 이후 첫 실행에서만 한다.
#   3) 바뀐 게 있으면 jeju-kids/state·site 를 main에 저장하고 GitHub Pages로 배포
# 이미 보낸 알림은 jeju-kids/state/sent.json 으로 걸러져 두 번 가지 않는다.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "jeju-kids/events.json"
      - "jeju-kids/sources.json"
      - "jeju-kids/template.html"
      - "jeju-kids/*.py"
  workflow_dispatch:
    inputs:
      send:
        description: 텔레그램으로 전송
        type: boolean
        default: true
      crawl:
        description: 지금 누리집·뉴스 수집
        type: boolean
        default: true

permissions:
  contents: write   # jeju-kids/state · site 갱신
  pages: write
  id-token: write

concurrency:
  group: jeju-kids
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KIDS_TELEGRAM_BOT_TOKEN: ${{ secrets.KIDS_TELEGRAM_BOT_TOKEN }}   # 아이 행사 전용 봇 (받은편지함에 필요)
      KIDS_TELEGRAM_CHAT_ID: ${{ secrets.KIDS_TELEGRAM_CHAT_ID }}       # 없으면 TELEGRAM_CHAT_ID
      KIDS_ALLOWED_CHAT_IDS: ${{ secrets.KIDS_ALLOWED_CHAT_IDS }}       # 함께 쓸 사람 (선택)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # 포스터 캡처 읽기 (선택)
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jeju-kids/requirements.txt

      - run: pip install -r jeju-kids/requirements.txt

      - name: 텔레그램 받은편지함
        working-directory: jeju-kids
        run: python inbox.py

      - name: 알림·수집·사이트
        run: >
          python jeju-kids/kids.py
          ${{ (github.event_name == 'workflow_dispatch' && !inputs.send) && '--no-send' || '' }}
          ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.crawl)) && '--auto' || '' }}

      - name: 상태 저장
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeju-kids/state jeju-kids/site
          git diff --cached --quiet && exit 0
          git diff --cached --quiet -- jeju-kids/site || echo "site=changed" >> "$GITHUB_OUTPUT"
          git commit -q -m "제주 아이 행사 알리미 갱신 $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.site == 'changed' || github.event_name != 'schedule'
        with:
          path: jeju-kids/site

      - name: GitHub Pages 배포
        if: steps.save.outputs.site == 'changed' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
        continue-on-error: true   # Pages를 아직 켜지 않았어도 알림은 계속 동작

      - name: 실패 알림 (텔레그램)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${KIDS_TELEGRAM_BOT_TOKEN:-$TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${KIDS_TELEGRAM_CHAT_ID:-$TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 제주 아이 행사 알리미 실행 실패 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
