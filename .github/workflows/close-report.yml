name: 장마감 수급체크

# 평일 장 마감 후 KB OpenAPI 데이터를 받아 리포트 사진·블로그 본문을 만들고 텔레그램으로 보낸다.
# 노트북이 꺼져 있어도 동작한다. (GitHub 예약 실행은 몇 분~십몇 분 늦어질 수 있음)
on:
  schedule:
    - cron: "47 6 * * 1-5"   # UTC 06:47 = 한국 15:47 (월~금)
  workflow_dispatch:
    inputs:
      send:
        description: 텔레그램으로 전송
        type: boolean
        default: true

permissions:
  contents: write   # README.md · latest/ · archive/ 갱신

concurrency:
  group: close-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: windows-latest   # Edge·한글 글꼴이 기본 설치되어 있어 화면 캡처가 PC와 같게 나온다
    timeout-minutes: 15
    env:
      KB_OPENAPI_APP_KEY: ${{ secrets.KB_OPENAPI_APP_KEY }}
      KB_OPENAPI_APP_SECRET: ${{ secrets.KB_OPENAPI_APP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REPORT_ONLY: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      BLOG_DIR: ${{ github.workspace }}\reports\blog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false

      - name: 리포트 생성·전송
        run: python report.py ${{ (github.event_name == 'workflow_dispatch' && !inputs.send) && '--no-send' || '' }}

      - name: 실패 알림 (텔레그램)
        if: failure()
        shell: pwsh
        run: |
          $log = if (Test-Path reports\report_server.log) { (Get-Content reports\report_server.log -Tail 5) -join "`n" } else { "" }
          $text = "⚠️ 장마감 수급체크 리포트 실패 (GitHub Actions)`n$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n$log"
          Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" -Body @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $text } | Out-Null

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close-report
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
