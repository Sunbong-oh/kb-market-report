name: 목표주가 변동 리포트

# 평일 08:40·21:00(KST) 한경 컨센서스·네이버 증권 리서치의 기업 리포트(전 섹터) 목표주가 상향·하향을 정리해
# consensus/ 에 저장한다 (텔레그램은 보내지 않음 - 2026-10-14 사용자 요청, 홈페이지에서만 본다) → 홈페이지(market-dashboard)가 이 파일이 생기면 바로 빌드해 '목표주가' 메뉴로 보여 준다(us-live 작업이 감지).
#   0) 늘 떠 있는 실시간 수급 작업(live_snapshot.py)이 평일 08:40·21:00에 이 워크플로를 실행 요청한다(gh workflow run)
#      아침 판 = 전날 밤 정리 뒤 새로 나온 리포트, 밤 판 = 오후 발간분까지 더한 그날 전체(다시 돌리면 새 리포트가 더해진다)
#      (trigger-consensus/ push 로도 실행된다)
#   1) GitHub 예약은 늦어지는 일이 있어 예비로만 걸어 둔다.
# 예약·루틴 실행은 그날 이미 정리했으면(consensus/날짜.md) 건너뛴다. 수동 실행(workflow_dispatch)은 언제든 다시 정리한다.
on:
  schedule:
    - cron: "42 23 * * 0-4"   # 08:42 KST (월~금) 예비 (그날 정리가 있으면 건너뜀)
  push:
    branches: [main]
    paths: ["trigger-consensus/**"]
  workflow_dispatch:
    inputs:
      day:
        description: "정리할 날짜 (YYYY-MM-DD, 비우면 오늘)"
        type: string
        default: ""

permissions:
  contents: write   # consensus/ 갱신

concurrency:
  group: consensus-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 오늘 이미 보냈는지 확인
        id: gate
        run: |
          day=$(TZ=Asia/Seoul date +%F)
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ -f "consensus/$day.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 발송됨 → 건너뜀"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.13"

      - name: 패키지 설치
        if: steps.gate.outputs.skip != 'true'
        run: pip install httpx python-dotenv beautifulsoup4

      - name: git 사용자 설정
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false

      - name: 리포트 생성 (텔레그램 없음)
        if: steps.gate.outputs.skip != 'true'
        run: >
          python consensus_report.py
          ${{ inputs.day && format('--date {0}', inputs.day) || '' }}
          --no-send
