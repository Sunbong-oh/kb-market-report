name: KB 응답 확인 (수동)
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KB_OPENAPI_APP_KEY: ${{ secrets.KB_OPENAPI_APP_KEY }}
      KB_OPENAPI_APP_SECRET: ${{ secrets.KB_OPENAPI_APP_SECRET }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt httpx python-dotenv
      - run: python surge_report.py 009540:Y 329180:Y 010140:Y 042660:Y --market-dump
      - run: for f in out/market/*.json; do echo "== $f"; cat "$f"; echo; done
